user www-data;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '[$time_local] $remote_addr "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Mapping header Upgrade sesuai anjuran Nginx untuk websocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Backend terpisah, jangan digabung dalam satu upstream round-robin
    upstream vless_ws_backend {
        server 127.0.0.1:10001;
        keepalive 32;
    }

    upstream vless_hup_backend {
        server 127.0.0.1:10002;
        keepalive 32;
    }

    upstream ssh_ws_backend {
        server 127.0.0.1:10004;
        keepalive 16;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        listen 8080;
        listen [::]:8080;
        listen 8880;
        listen [::]:8880;
        server_name _;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl reuseport;
        listen [::]:443 ssl reuseport;
        http2 on;

        server_name _;
        root /var/www/html;
        index index.html;

        ssl_certificate     /etc/xray/xray.crt;
        ssl_certificate_key /etc/xray/xray.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:20m;
        ssl_session_tickets off;

        # cipher modern, lebih aman dan stabil
        ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:
                     ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                     ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        # halaman biasa
        location / {
            try_files $uri $uri/ =404;
        }

        # VLESS WebSocket
        location /vless-ws {
            proxy_redirect off;
            proxy_pass http://vless_ws_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 30;
            proxy_buffering off;
        }

        # VLESS HTTPUpgrade
        location /xvless-hup {
            proxy_redirect off;
            proxy_pass http://vless_hup_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 30;
            proxy_buffering off;
        }

        # SSH over WebSocket
        location /ssh-ws {
            proxy_redirect off;
            proxy_pass http://ssh_ws_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 30;
            proxy_buffering off;
        }
    }
}user www-data;
